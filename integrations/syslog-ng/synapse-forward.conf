@version: 4.26

# Forwards Synapse's syslog to a remote host over UDP.
# Edit the two values below. Nothing else needs to change.
@define synapse_remote_host "192.0.2.1"
@define synapse_remote_port 514

# Synapse writes to /dev/log (or to the journal on a systemd host).
source s_synapse_local {
    system();
};

# Synapse's fallback when no unix socket exists: UDP to localhost.
# TCP 601 is deliberately not opened. Synapse's TCP fallback writes each
# message with no delimiter, so syslog-ng could not split the stream and
# would merge messages.
# The rewrite gives these messages the local host name. Without it they carry
# "localhost", the name of the peer address.
source s_synapse_udp {
    channel {
        source { network(ip("127.0.0.1") port(514) transport("udp")); };
        rewrite { set("$LOGHOST" value("HOST")); };
    };
};

# Matches the program name exactly. If you change `logging.syslog.identifier`
# in Synapse, change it here too.
filter f_synapse { program("synapse" type(string)); };

destination d_synapse_remote {
    network("`synapse_remote_host`" transport("udp") port(`synapse_remote_port`));

    # RFC 5424 instead of RFC 3164: add flags(syslog-protocol) to network().
    #
    # TCP, when the receiver can take it. TCP has no datagram ceiling. Raise
    # the limit too, with `options { log-msg-size(1048576); };` at the top
    # level, or syslog-ng cuts every message at its 64 KiB default:
    #   network("`synapse_remote_host`" transport("tcp") port(`synapse_remote_port`));
    #
    # TLS:
    #   network("`synapse_remote_host`" transport("tls") port(6514)
    #       tls(ca-dir("/etc/ssl/certs") peer-verify(required-trusted)));
};

# final keeps Synapse's lines out of the local log files below this path.
log {
    source(s_synapse_local);
    source(s_synapse_udp);
    filter(f_synapse);
    destination(d_synapse_remote);
    flags(final);
};
