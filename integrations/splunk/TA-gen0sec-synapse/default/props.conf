# Gen0Sec Synapse.
#
# Set `sourcetype = gen0sec:synapse` on the input that receives Synapse's
# syslog stream (monitor, TCP/UDP or HEC raw). App logs and access logs share
# that stream. Access records are moved to `gen0sec:synapse:access` at index
# time, and app log lines keep `gen0sec:synapse`.

[gen0sec:synapse]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
# A record holds the request body when `include_request_body` is on, up to
# `max_body_size` (1 MiB by default) before JSON escaping.
TRUNCATE = 8388608
# The record's own time, in UTC with nanoseconds. App log lines have no such
# field and are stamped by Splunk's default timestamp handling.
TIME_PREFIX = "timestamp":"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%9N
MAX_TIMESTAMP_LOOKAHEAD = 32
TZ = UTC
# Drop any syslog header (RFC 3164 or 5424) in front of an access record, so
# _raw is the record's JSON.
SEDCMD-g0s_strip_syslog_header = s/^[^{]*(\{"event_type":"http_access_log")/\1/
TRANSFORMS-g0s_access_sourcetype = gen0sec_synapse_access_sourcetype

[gen0sec:synapse:access]
# Index-time settings for HEC /event, which sends this sourcetype directly.
# The timestamp settings apply when the HEC URL carries
# auto_extract_timestamp=true.
SHOULD_LINEMERGE = false
TRUNCATE = 8388608
TIME_PREFIX = "timestamp":"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%9N
MAX_TIMESTAMP_LOOKAHEAD = 32
TZ = UTC
KV_MODE = json

# CIM Web data model.
FIELDALIAS-g0s_network = network.src_ip AS src network.src_port AS src_port network.dst_ip AS dest network.dst_port AS dest_port
FIELDALIAS-g0s_http = http.host AS site response.status AS status http.content_length AS bytes_in response.content_length AS bytes_out performance.request_time_ms AS duration
# A passthrough record has empty method, path and query, and no user agent:
# leave those fields out rather than empty.
EVAL-http_method = if(len('http.method') > 0, 'http.method', null())
EVAL-uri_path = if(len('http.path') > 0, 'http.path', null())
EVAL-uri_query = if(len('http.query') > 0, 'http.query', null())
EVAL-http_user_agent = if(len('http.user_agent') > 0 AND 'http.user_agent' != "null", 'http.user_agent', null())
EVAL-http_content_type = if(len('http.content_type') > 0 AND 'http.content_type' != "null", 'http.content_type', null())
EVAL-url = if(len('http.path') > 0, 'http.scheme' . "://" . 'http.host' . ":" . 'http.port' . 'http.path' . if(len('http.query') > 0, "?" . 'http.query', ""), null())
EVAL-action = if(isnotnull('remediation.waf_action') AND match('remediation.waf_action', "^(block|ratelimit)$"), "blocked", "allowed")
EVAL-synapse_mode = if('upstream.method' == "passthrough", "passthrough", "proxy")
EVAL-vendor = "Gen0Sec"
EVAL-product = "Synapse"
EVAL-vendor_product = "Gen0Sec Synapse"
