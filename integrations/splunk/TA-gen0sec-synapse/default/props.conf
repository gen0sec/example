# Gen0Sec Synapse.
#
# Set `sourcetype = gen0sec:synapse` on the input that receives Synapse's
# syslog stream (monitor, TCP/UDP or HEC raw). App logs and access logs share
# that stream. Access records are moved to `gen0sec:synapse:access` at index
# time, and app log lines keep `gen0sec:synapse`.

[gen0sec:synapse]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
# A record holds the request body when `include_request_body` is on, up to
# `max_body_size` (1 MiB by default) before JSON escaping.
TRUNCATE = 8388608
# Splunk first takes the time it finds near the start of the line: the
# syslog header's, or for a line without one, the first time in it. The
# gen0sec_synapse_time transform then gives access records their own time.
# No TIME_PREFIX here: an app log line has no "timestamp" field, and Splunk
# would give it the previous event's time.
MAX_TIMESTAMP_LOOKAHEAD = 128
# In this order: take the host from the syslog header, move access records to
# their sourcetype, drop the header so _raw is the record's JSON, then give
# the record its own time, read from that JSON's top-level "timestamp" (a
# request header named timestamp is not at the top level).
# Not a SEDCMD: Splunk applies SEDCMD before TRANSFORMS, so the host would be
# gone.
TRANSFORMS-g0s = gen0sec_synapse_host_5424, gen0sec_synapse_host_bsd, gen0sec_synapse_access_sourcetype, gen0sec_synapse_strip_header, gen0sec_synapse_time

[gen0sec:synapse:access]
# Index-time settings for HEC /event, which sends this sourcetype directly.
# The record's time comes from the same transform as above, which reads the
# top-level "timestamp" only, not a request header's.
SHOULD_LINEMERGE = false
TRUNCATE = 8388608
TRANSFORMS-g0s-time = gen0sec_synapse_time
KV_MODE = json

# CIM Web data model.
FIELDALIAS-g0s_network = network.src_ip AS src network.src_port AS src_port network.dst_ip AS dest network.dst_port AS dest_port
FIELDALIAS-g0s_http = http.host AS site response.status AS status http.content_length AS bytes_in response.content_length AS bytes_out performance.request_time_ms AS duration
# A passthrough record has empty method, path and query, and no user agent:
# leave those fields out rather than empty.
EVAL-http_method = if(len('http.method') > 0, 'http.method', null())
EVAL-uri_path = if(len('http.path') > 0, 'http.path', null())
EVAL-uri_query = if(len('http.query') > 0, 'http.query', null())
EVAL-http_user_agent = if(len('http.user_agent') > 0 AND 'http.user_agent' != "null", 'http.user_agent', null())
EVAL-http_content_type = if(len('http.content_type') > 0 AND 'http.content_type' != "null", 'http.content_type', null())
EVAL-url = if(len('http.path') > 0, 'http.scheme' . "://" . 'http.host' . ":" . 'http.port' . 'http.path' . if(len('http.query') > 0, "?" . 'http.query', ""), null())
# A challenge stops the request before the upstream, as a block does. No
# action when the record's fields were not extracted.
EVAL-action = case(isnull('response.status'), null(), match('remediation.waf_action', "^(block|challenge|ratelimit)$"), "blocked", true(), "allowed")
EVAL-synapse_mode = if('upstream.method' == "passthrough", "passthrough", "proxy")
EVAL-vendor = "Gen0Sec"
EVAL-product = "Synapse"
EVAL-vendor_product = "Gen0Sec Synapse"

# events.log, the block events Synapse writes (`events_log` in its config), in
# the text and JSON formats. Set `sourcetype = gen0sec:synapse:events` on a
# monitor input for the file. A CEF line (format = cef) keeps this sourcetype
# and is not parsed.
[gen0sec:synapse:events]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 100000
# The time is the line's own `ts`: at the start of a text line, after
# {"ts":" in a JSON one. UTC, second precision.
TIME_PREFIX = ^(?:\{"ts":")?
TIME_FORMAT = %Y-%m-%dT%H:%M:%SZ
MAX_TIMESTAMP_LOOKAHEAD = 20
TZ = UTC
# JSON is read as JSON (nested `eve` becomes eve.alert.signature_id and so
# on) and `key=value` pairs as pairs, with the escapes kept as written.
KV_MODE = auto

# `{ts} [{layer}/{action}] k=v ...`. The JSON format has these as keys. An
# IPv6 `ip:port` does not match the IPv4 patterns and stays whole in `src` or
# `dst`.
EXTRACT-g0s_events_head = ^(?<ts>\S+) \[(?<layer>[^/\]\s]+)/(?<action>[^\]\s]+)\]
EXTRACT-g0s_events_src = \ssrc=(?<src_ip>\d{1,3}(?:\.\d{1,3}){3}):(?<src_port>\d+)(?:\s|$)
EXTRACT-g0s_events_dst = \sdst=(?<dst_ip>\d{1,3}(?:\.\d{1,3}){3}):(?<dst_port>\d+)(?:\s|$)
EXTRACT-g0s_events_rule = \srule=(?<rule_id>\S+)
EXTRACT-g0s_events_msg = \smsg="(?<rule_msg>(?:[^"\\]|\\.)*)"
EXTRACT-g0s_events_sids = \sids_sids=(?<ids_sids>\S+)

# CIM. Intrusion_Detection for the layers that detect (ids, waf, captcha,
# threat_intel), Network_Traffic for the ones that enforce a rule
# (smart_firewall, access_rules, rate_limit). A line with no layer, such as a
# CEF one, gets none of it.
FIELDALIAS-g0s_events_dest_port = dst_port AS dest_port
EVAL-synapse_action = action
EVAL-src = coalesce(src_ip, src)
EVAL-dest = coalesce(dst_ip, dst)
EVAL-action = case(isnull(layer), null(), match(action, "^(block|ratelimit|captcha|drop)$"), "blocked", true(), "allowed")
EVAL-severity = case(NOT match(layer, "^(ids|waf|captcha|threat_intel)$"), null(), layer == "ids", "low", layer == "captcha" OR action == "ratelimit", "medium", true(), "high")
EVAL-ids_type = case(layer == "waf" OR layer == "captcha", "application", layer == "ids", "network", true(), null())
EVAL-category = if(match(layer, "^(ids|waf|captcha|threat_intel)$"), layer, null())
EVAL-signature = if(match(layer, "^(ids|waf|captcha|threat_intel)$"), rule_msg, null())
EVAL-signature_id = if(match(layer, "^(ids|waf|captcha|threat_intel)$"), rule_id, null())
EVAL-rule = if(match(layer, "^(smart_firewall|access_rules|rate_limit)$"), rule_id, null())
EVAL-dvc = if(isnotnull(layer), host, null())
EVAL-vendor = if(isnotnull(layer), "Gen0Sec", null())
EVAL-product = if(isnotnull(layer), "Synapse", null())
EVAL-vendor_product = if(isnotnull(layer), "Gen0Sec Synapse", null())
