[gen0sec_synapse_access]
search = sourcetype="gen0sec:synapse:access"

[gen0sec_synapse_events]
search = sourcetype="gen0sec:synapse:events" layer=*

[gen0sec_synapse_events_ids]
search = sourcetype="gen0sec:synapse:events" (layer=ids OR layer=waf)

[gen0sec_synapse_events_network]
search = sourcetype="gen0sec:synapse:events" (layer=smart_firewall OR layer=access_rules OR layer=rate_limit)
