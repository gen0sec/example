[gen0sec_synapse_access_sourcetype]
REGEX = \{"event_type":"http_access_log"
FORMAT = sourcetype::gen0sec:synapse:access
DEST_KEY = MetaData:Sourcetype

# The host from the header in front of the message: RFC 5424, RFC 3164 (with
# or without PRI), or the ISO date AxoSyslog's splunk-hec-raw() writes. A
# line without a header, or with the nil host "-", keeps the input's host.
[gen0sec_synapse_host]
REGEX = ^(?:<\d{1,3}>1 \S+ |(?:<\d{1,3}>)?[A-Z][a-z]{2} [ \d]\d \d\d:\d\d:\d\d |\d{4}-\d\d-\d\dT\S+ )([^\s\-{][^\s{]*)\s
FORMAT = host::$1
DEST_KEY = MetaData:Host

# Drop any syslog header in front of an access record. An eval rather than a
# regex transform, which would only see the first LOOKAHEAD bytes of a large
# record.
[gen0sec_synapse_strip_header]
INGEST_EVAL = _raw=replace(_raw, "^[^{]*([{]\"event_type\":\"http_access_log\")", "\1")
