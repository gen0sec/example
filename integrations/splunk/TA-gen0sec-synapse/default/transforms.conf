# An access record is a JSON object whose "event_type" is "http_access_log",
# after at most 256 bytes of syslog header and any keys that sort in front of
# it. Their values may be strings, numbers, true, false, null or one level of
# object (the `error` of a failed request). Whitespace is allowed anywhere
# JSON allows it, so a relay that re-serialises the record (spaces, sorted
# keys) is still recognised. The header may contain "{" (RFC 5424 structured
# data), but a "{" right after a ":" is a value in an enclosing object, so a
# record held inside another object is not an access record.
# A route regex sees only the first LOOKAHEAD (4096) bytes of _raw, so the
# match is anchored at the start. The same pattern is repeated in the strip
# and time evals below, with \d, \., \{ and \} as [0-9], [.], [{] and [}], and
# each backslash doubled for the eval string.
[gen0sec_synapse_access_sourcetype]
REGEX = ^.{0,256}?(?<!":)(?<!": )\{\s*(?:"(?!event_type")[^"]*"\s*:\s*(?:"(?:[^"\\]|\\.)*"|null|true|false|-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?|\{(?:[^{}"]|"(?:[^"\\]|\\.)*")*\})\s*,\s*)*"event_type"\s*:\s*"http_access_log"
FORMAT = sourcetype::gen0sec:synapse:access
DEST_KEY = MetaData:Sourcetype

# The host from the header in front of the message. Two transforms, so each
# has one capture group. A host counts only where a program tag follows it
# (`prog[pid]:` or `prog:`), or, for RFC 5424, where the fixed field layout
# puts it. An IPv6 address, which AxoSyslog writes when the peer has no
# name, is a host when it has two or more colons. A line with no host, such as Synapse's own `<30>Oct 20 14:28:21
# synapse[1]: msg`, or an ISO date followed by a level, keeps the input's host.
# So does the nil host "-". A value cannot end in a space here, so \s ends them.
[gen0sec_synapse_host_5424]
REGEX = ^<\d{1,3}>1 \S+ (?!-\s)(\S+) \S+ \S+ \S+ [-\[]
FORMAT = host::$1
DEST_KEY = MetaData:Host

# RFC 3164 (with or without PRI), and the ISO date AxoSyslog's
# splunk-hec-raw() writes.
[gen0sec_synapse_host_bsd]
REGEX = ^(?:(?:<\d{1,3}>)?[A-Z][a-z]{2} [ \d]\d \d\d:\d\d:\d\d |\d{4}-\d\d-\d\dT\S+ )((?:[0-9A-Fa-f]{0,4}:){2,}[0-9A-Fa-f.:]*|[^\s\-\[:][^\s\[:]*) [^\s\[:]+(?:\[\d+\])?:\s
FORMAT = host::$1
DEST_KEY = MetaData:Host

# Drop any syslog header in front of an access record. An eval rather than a
# regex transform, which would only see the first LOOKAHEAD bytes of a large
# record.
[gen0sec_synapse_strip_header]
INGEST_EVAL = _raw=replace(_raw, "^.{0,256}?(?=(?<!\":)(?<!\": )[{]\s*(?:\"(?!event_type\")[^\"]*\"\s*:\s*(?:\"(?:[^\"\\\\]|\\\\.)*\"|null|true|false|-?[0-9]+(?:[.][0-9]+)?(?:[eE][+-]?[0-9]+)?|[{](?:[^{}\"]|\"(?:[^\"\\\\]|\\\\.)*\")*[}])\s*,\s*)*\"event_type\"\s*:\s*\"http_access_log\")", "")

# An access record's own time: UTC, nanoseconds. After the strip, so _raw is
# the record's JSON, and read with json_extract, which takes only the
# top-level "timestamp" (a request header can be named timestamp too). A
# value that does not parse leaves the time Splunk took.
[gen0sec_synapse_time]
INGEST_EVAL = _time=if(match(_raw, "^.{0,256}?(?<!\":)(?<!\": )[{]\s*(?:\"(?!event_type\")[^\"]*\"\s*:\s*(?:\"(?:[^\"\\\\]|\\\\.)*\"|null|true|false|-?[0-9]+(?:[.][0-9]+)?(?:[eE][+-]?[0-9]+)?|[{](?:[^{}\"]|\"(?:[^\"\\\\]|\\\\.)*\")*[}])\s*,\s*)*\"event_type\"\s*:\s*\"http_access_log\""), coalesce(strptime(replace(json_extract(_raw, "timestamp"), "Z$", "+0000"), "%Y-%m-%dT%H:%M:%S.%9N%z"), _time), _time)
