---
- name: Setup Fail2Ban with Gen0Sec Integration
  hosts: all
  become: true
  vars:
    gen0sec_api_token: ""  # Set this via -e gen0sec_api_token=your_token or in group_vars/host_vars
    gen0sec_expiration: 600  # Default: 10 minutes
    fail2ban_jail_enabled: true
    fail2ban_backend: systemd  # Use 'auto' for automatic detection

  tasks:
    - name: Install fail2ban
      ansible.builtin.package:
        name: fail2ban
        state: present
      when: ansible_facts["os_family"] in ['Debian', 'RedHat']

    - name: Install curl
      ansible.builtin.package:
        name: curl
        state: present

    - name: Install jq (optional)
      ansible.builtin.package:
        name: jq
        state: present

    - name: Copy Gen0Sec action file
      ansible.builtin.copy:
        src: gen0sec.conf
        dest: /etc/fail2ban/action.d/gen0sec.conf
        owner: root
        group: root
        mode: '0640'
        backup: yes

    - name: Write the Gen0Sec API key header file
      ansible.builtin.copy:
        content: "Authorization: Bearer {{ gen0sec_api_token }}\n"
        dest: /etc/fail2ban/gen0sec.headers
        owner: root
        group: root
        mode: '0600'
      no_log: true
      when: gen0sec_api_token != ""

    - name: Configure Gen0Sec expiration
      ansible.builtin.replace:
        path: /etc/fail2ban/action.d/gen0sec.conf
        regexp: '^expiration\s*=\s*<bantime>.*$'
        replace: 'expiration = {{ gen0sec_expiration }}'

    - name: Configure DEFAULT section in jail.local
      ansible.builtin.blockinfile:
        path: /etc/fail2ban/jail.local
        block: |
          [DEFAULT]
          banaction = gen0sec
          banaction_allports = gen0sec
          backend = {{ fail2ban_backend }}
        marker: "# {mark} ANSIBLE MANAGED BLOCK - DEFAULT"
        create: yes
        owner: root
        group: root
        mode: '0644'

    - name: Configure sshd jail
      ansible.builtin.blockinfile:
        path: /etc/fail2ban/jail.local
        block: |
          [sshd]
          enabled = {{ 'true' if fail2ban_jail_enabled else 'false' }}
        marker: "# {mark} ANSIBLE MANAGED BLOCK - SSHD"
        create: yes
        owner: root
        group: root
        mode: '0644'

    - name: Ensure fail2ban service is enabled and started
      ansible.builtin.systemd:
        name: fail2ban
        enabled: yes
        state: started
        daemon_reload: yes

    - name: Restart fail2ban to apply configuration
      ansible.builtin.systemd:
        name: fail2ban
        state: restarted
