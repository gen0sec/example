#
# Gen0Sec API action file for Fail2Ban
#
# IMPORTANT
#
# The API key is read from a separate header file (g0sheaders below), never from
# this file or the command line: Fail2Ban logs the full command when an action fails.
#
# This action depends on curl (and optionally jq).
#
# To get your Gen0Sec API token, visit your Gen0Sec dashboard.
#

[Definition]

# Option:  actionstart
# Notes.:  command executed on demand at the first ban (or at the start of Fail2Ban if actionstart_on_demand is set to false).
# Values:  CMD
#
actionstart =

# Option:  actionstop
# Notes.:  command executed at the stop of jail (or at the end of Fail2Ban)
# Values:  CMD
#
actionstop =

# Option:  actioncheck
# Notes.:  command executed once before each actionban command
# Values:  CMD
#
actioncheck =

# Sends one batch to the Signal API. The command succeeds only on HTTP 200:
# a rejected key (401/403), a rejected entry (206) or an unreachable API makes
# Fail2Ban log the action as failed instead of reporting a ban that did not happen.
g0spost = curl -sS -o /dev/null -w '%%{http_code}' -X POST <g0surl> \
          -H 'Content-Type: application/json' \
          -H @<g0sheaders> \
          -d

# Option:  actionban
# Notes.:  command executed when banning an IP. Take care that the
#          command is executed with Fail2Ban user rights.
#          Creates a Gen0Sec access rule named fail2ban-<host>-<jail>-<ip>.
# Tags:    <ip>  IP address
#          <failures>  number of failures
#          <time>  unix timestamp of the ban time
# Values:  CMD
#
actionban = %(g0spost)s '[{"schema_version":2,"kind":"access_rule","op":"upsert","rule_ref":"fail2ban-<g0shost>-<name>-<ip>","expires_in":<expiration>,"reason":"Fail2Ban <name>","rule":{"target":{"ip":"<ip>"},"action":"block"}}]' | grep -qx 200

# Option:  actionprolong
# Notes.:  command executed when Fail2Ban extends a ban (bantime.increment).
#          Sending the ban again updates the rule's expiry.
# Values:  CMD
#
actionprolong = %(actionban)s

# Option:  actionunban
# Notes.:  command executed when unbanning an IP. Take care that the
#          command is executed with Fail2Ban user rights.
#          Deletes the rule the ban created, found by its name.
# Tags:    <ip>  IP address
#          <failures>  number of failures
#          <time>  unix timestamp of the ban time
# Values:  CMD
#
actionunban = %(g0spost)s '[{"schema_version":2,"kind":"access_rule","op":"delete","rule_ref":"fail2ban-<g0shost>-<name>-<ip>"}]' | grep -qx 200

[Init]

# File holding the API key as one header line, readable by root only (mode 0600):
#   Authorization: Bearer <your Gen0Sec API key>
# The key needs the signal:write permission.
g0sheaders = /etc/fail2ban/gen0sec.headers

# Signal API endpoint
g0surl = https://api.gen0sec.com/v2/signal

# This host's part of the rule name. Each host deletes only the rules it created,
# so one host's unban does not lift a block another host still holds.
# Set a different value if two hosts share a short hostname.
g0shost = <sh-hostname>

# Expiration time in seconds; defaults to the jail's bantime.
# Must not be negative: a permanent ban (bantime = -1) is rejected by the API.
expiration = <bantime>

