#
# Gen0Sec API action file for Fail2Ban
#
# IMPORTANT
#
# Please set jail.local's permission to 640 because it contains your Gen0Sec API token.
#
# This action depends on curl (and optionally jq).
#
# To get your Gen0Sec API token, visit your Gen0Sec dashboard.
#

[Definition]

# Option:  actionstart
# Notes.:  command executed on demand at the first ban (or at the start of Fail2Ban if actionstart_on_demand is set to false).
# Values:  CMD
#
actionstart =

# Option:  actionstop
# Notes.:  command executed at the stop of jail (or at the end of Fail2Ban)
# Values:  CMD
#
actionstop =

# Option:  actioncheck
# Notes.:  command executed once before each actionban command
# Values:  CMD
#
actioncheck =

# Option:  actionban
# Notes.:  command executed when banning an IP. Take care that the
#          command is executed with Fail2Ban user rights.
# Tags:    <ip>  IP address
#          <failures>  number of failures
#          <time>  unix timestamp of the ban time
# Values:  CMD
#
actionban = curl -s -o /dev/null -X POST https://api.gen0sec.com/v2/signal \
            -H 'Content-Type: application/json' \
            -H 'Authorization: Bearer <g0stoken>' \
            -d '[{"schema_version":2,"kind":"access_rule","op":"upsert","rule_ref":"fail2ban-<name>-<ip>","expires_in":<expiration>,"reason":"Fail2Ban <name>","rule":{"target":{"ip":"<ip>"},"action":"block"}}]'

# Option:  actionunban
# Notes.:  command executed when unbanning an IP. Take care that the
#          command is executed with Fail2Ban user rights.
# Tags:    <ip>  IP address
#          <failures>  number of failures
#          <time>  unix timestamp of the ban time
# Values:  CMD
#
# The unban deletes the rule the ban created, found by its rule_ref.
actionunban = curl -s -o /dev/null -X POST https://api.gen0sec.com/v2/signal \
              -H 'Content-Type: application/json' \
              -H 'Authorization: Bearer <g0stoken>' \
              -d '[{"schema_version":2,"kind":"access_rule","op":"delete","rule_ref":"fail2ban-<name>-<ip>"}]'

[Init]

# Your Gen0Sec API Bearer token. The key needs the signal:write permission.
g0stoken =

# Expiration time in seconds; defaults to the jail's bantime.
# Must not be negative: a permanent ban (bantime = -1) is rejected by the API.
expiration = <bantime>

