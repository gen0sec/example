# Run:  docker compose up -d && ./test.sh
services:
  synapse:
    image: ${SYNAPSE_IMAGE:-registry.gen0sec.com/gen0sec/synapse:0.8.9}
    command: ["-c", "/etc/synapse/config.yaml"]
    ports: ["8087:8080"]
    volumes: [".:/etc/synapse:ro"]
    depends_on: [whoami, origin]
  whoami:
    image: traefik/whoami:v1.10.3
    hostname: whoami
  origin:
    image: nginx:1.27-alpine
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
