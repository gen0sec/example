events {}
http {
  server {
    listen 80;
    location / {
      # What a typical origin leaks, and what a rule should add to or replace.
      add_header X-Powered-By "demo-origin" always;
      add_header X-Internal-Trace "abc123" always;
      add_header X-Content-Type-Options "from-origin" always;
      add_header Cache-Control "max-age=600" always;
      add_header Set-Cookie "origin=1; Path=/" always;
      return 200 "origin\n";
    }
  }
}
