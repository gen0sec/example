# Run:  ./make-certs.sh && docker compose up -d
# The image is the 0.8.9 release image. To use a build of your own, set
# SYNAPSE_IMAGE (for example SYNAPSE_IMAGE=synapse:local docker compose up -d).
#
# Pebble is a test ACME server. It checks the challenge by connecting to
# app.example.com on port 80; the network alias makes that name reach Synapse.
# For a real server, drop pebble and see the README.
services:
  # Certbot's directory must exist when Synapse starts. It is a named volume, so
  # this one-shot service makes the empty live directory first.
  init:
    image: busybox:1.36
    command: ["mkdir", "-p", "/etc/letsencrypt/live"]
    volumes: ["letsencrypt:/etc/letsencrypt"]
  synapse:
    image: ${SYNAPSE_IMAGE:-registry.gen0sec.com/gen0sec/synapse:0.8.9}
    command: ["-c", "/etc/synapse/config.yaml"]
    ports: ["8089:80", "8443:443"]
    volumes:
      - ".:/etc/synapse:ro"
      - "letsencrypt:/etc/letsencrypt:ro"
    networks:
      certbot:
        ipv4_address: 172.30.8.10
        aliases: [app.example.com]
    depends_on:
      init: { condition: service_completed_successfully }
      whoami: { condition: service_started }
      webroot: { condition: service_started }
  whoami:
    image: traefik/whoami:v1.10.3
    hostname: whoami
    networks: [certbot]
  webroot:
    image: nginx:1.27-alpine
    volumes:
      - "./nginx.conf:/etc/nginx/conf.d/default.conf:ro"
      - "webroot:/usr/share/nginx/html:ro"
    networks: [certbot]
  pebble:
    image: ghcr.io/letsencrypt/pebble:2.9.0
    command: ["-config", "/etc/pebble/pebble-config.json"]
    environment:
      # Skip the pauses Pebble adds to behave like a busy CA.
      PEBBLE_VA_NOSLEEP: "1"
    volumes:
      - "./pebble-config.json:/etc/pebble/pebble-config.json:ro"
      - "./pebble-tls:/pebble-tls:ro"
    networks: [certbot]
  certbot:
    image: certbot/certbot:v2.11.0
    profiles: ["demo"]
    environment:
      # Trust the test server's certificate. Remove this for a real server.
      REQUESTS_CA_BUNDLE: /pebble-tls/cert.pem
    command:
      - certonly
      - --webroot
      - -w
      - /var/www/html
      - -d
      - app.example.com
      - --server
      - https://pebble:14000/dir
      - --email
      - admin@example.com
      - --agree-tos
      - --no-eff-email
    volumes:
      - "letsencrypt:/etc/letsencrypt"
      - "webroot:/var/www/html"
      - "./pebble-tls:/pebble-tls:ro"
    networks: [certbot]
  client:
    image: alpine/openssl:3.3.2
    profiles: ["demo"]
    entrypoint: ["/bin/sh", "/demo/demo.sh"]
    volumes:
      - "./demo.sh:/demo/demo.sh:ro"
      - "./pebble-tls:/pebble-tls:ro"
    networks: [certbot]

volumes:
  letsencrypt:
  webroot:

networks:
  certbot:
    ipam:
      config: [{ subnet: 172.30.8.0/24 }]
