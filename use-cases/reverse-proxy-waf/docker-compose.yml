# reverse-proxy-waf: Synapse in front of a demo backend.
# Needs a login to registry.gen0sec.com (see README) and certs/ (see README).
services:
  synapse:
    image: registry.gen0sec.com/gen0sec/synapse:0.8.8
    command:
      - "-c"
      - "/etc/synapse/config.yaml"
      - "--security-rules-config"
      - "/etc/synapse/security_rules.yaml"
    # Not set by default. With a Gen0Sec API key the rules in
    # security_rules.yaml are no longer read (see README):
    #   API_KEY=... docker compose up
    environment:
      API_KEY: ${API_KEY:-}
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      # The whole directory, not single files, so that an edit to a rule file
      # is seen and reloaded while Synapse runs. This also brings in certs/.
      - .:/etc/synapse:ro
      # Block events (events.log) land here.
      - ./logs:/var/log/synapse
    depends_on:
      - whoami

  # Demo backend: answers with the request it received.
  whoami:
    image: traefik/whoami:v1.10.3
