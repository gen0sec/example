# smart-firewall: Synapse as an XDP firewall that blocks by fingerprint and by
# source address from `smart_firewall_rules` (see security_rules.yaml), with
# the amygdala bridge for the other JA4 kinds. The IDS bans the source of a
# matching drop, reject or block rule. No API key.
mode: agent

firewall:
  # Master switch. Default: true.
  enabled: true
  # Force the XDP backend. Default: auto (XDP, then nftables, then iptables,
  # then none). With `xdp` there is no fallback: if XDP cannot be loaded, no
  # kernel firewall is installed.
  mode: xdp
  amygdala:
    # Default: false. It enforces the JA4 kinds other than ja4t. The ja4t
    # block entries and the `rules:` expressions do not depend on it.
    enabled: true
    # Default: auto. On a build with eBPF it tries xdp, then nftables, then
    # iptables. `afxdp` needs a dedicated interface and is not used here.
    backend: auto
    # The bridge enforces on ONE interface. Default: unset, the first physical
    # interface XDP attached to, while XDP itself covers every attached
    # interface. Set it to choose. If `network.interfaces` marks one with the
    # `smart_firewall` role, leave this unset: a different value is an error.
    # iface: eth0

# XDP, the XDP IDS and XDP capture attach to `network.iface` / `network.ifaces`
# (or `network.interfaces`); unset, every physical up interface is used. To
# pin one interface, set it here and `capture.interface` below to your uplink.
# network:
#   iface: eth0

# The expression rules need the flow events capture produces. Default: true.
capture:
  enabled: true
  # Chooses the interface of the AF_PACKET fallback; XDP ignores it. Unset or
  # "auto" binds every interface, including lo, bridges and veth. Default:
  # unset. Change it to your uplink.
  interface: eth0

ids:
  enabled: true
  # Default: xdp.
  capture_mode: xdp
  rule_paths:
    - "/etc/synapse/rules/*.rules"
  # Ban the source of a flow that matches a drop, reject or block rule.
  # Default: false.
  enforce_block: true
  # Floor, in seconds, of the adaptive smart-firewall ban. Repeat offenders
  # escalate from it. Default: 60; values below 60 are raised to 60.
  ban_base_secs: 60
  # Your own networks. Sources inside them are never banned. Replace with
  # yours; documentation range shown.
  address_vars:
    HOME_NET: "[192.0.2.0/24]"
  # Turn off pulling managed rules: this example is local-only.
  managed_rules_path: ""

logging:
  # Default: info.
  level: info
  # Default: false (console only).
  file_logging_enabled: true
  # Default: /var/log/synapse
  log_directory: "/var/log/synapse"
  # Security-event log, {log_directory}/events.log by default. Default
  # format: text.
  events_log_format: json
  # The amygdala bridge runs only while this log is on. Default: true.
  eventbridge_log:
    enabled: true
