# Rules for smart-firewall, loaded from this file because no Gen0Sec API key
# is set. Addresses are documentation ranges: replace them with your own.
#
# `access_rules` and `waf_rules` are both required keys. Neither holds a rule
# here: the WAF belongs to proxy mode.
access_rules:
  id: example-smart-firewall
  name: Example smart firewall
  description: Access rules are required by the file format; none are set here
  allow: { ips: [], country: [], asn: [] }
  block: { ips: [], country: [], asn: [] }

waf_rules:
  rules: []

# Amygdala rules, enforced only while firewall.amygdala.enabled is true.
#
# `block` and `allow` take {kind, value} entries: a fingerprint, where kind is
# ja4, ja4s, ja4t, ja4ts, ja4l, ja4ls, ja4h, ja4x or ja4ssh. An entry may carry
# ttl_seconds, or expires_at (RFC 3339), but not both.
#
# `rules` holds expressions, {id, expression, action}. `action` defaults to
# block. Allow rules are applied first and exempt the flows they match from
# any block rule. An `in` test takes a braced set: `ip.src in {192.0.2.0/24}`.
# An expression that does not compile is skipped with a warning at start, and
# `--check-config` does not catch it.
smart_firewall_rules:
  block:
    - kind: ja4t
      value: "64240_2-4-8-1-3_1460_10"
      ttl_seconds: 3600
  rules:
    - id: "block-example-range"
      expression: 'ip.src in {198.51.100.0/24}'
      action: "block"
    - id: "allow-management"
      expression: 'ip.src in {192.0.2.0/28}'
      action: "allow"
