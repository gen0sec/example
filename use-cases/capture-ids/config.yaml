# capture-ids: Synapse as a detect-only intrusion detection agent on a real
# interface. Packet capture and the XDP-based IDS run together, local rules
# are matched, and alerts are written to an EVE JSON file. Nothing is blocked.
# This is the production shape; host-ids is the portable loopback demo.
mode: agent

firewall:
  # Default: auto (XDP, then nftables, then iptables, then none). The IDS is
  # detect-only, so the firewall is only there to host the XDP program.
  mode: auto

# The XDP program and the XDP IDS run on the interfaces named here.
# Default: unset, which auto-detects every physical interface that is up. To
# use one interface, set both this and `capture.interface` below, for example:
#   network:
#     iface: eth0

capture:
  # Default: true.
  enabled: true
  # Used only by the AF_PACKET capture and the AF_PACKET IDS fallback. It does
  # not choose the XDP interface: that is `network` above. Default: unset,
  # which binds the AF_PACKET paths to every interface (lo, bridges and veths
  # included); `network.iface` does not narrow it. Keep it set to the same
  # uplink as `network.iface`.
  interface: eth0

ids:
  enabled: true
  # Default: xdp. Falls back to the AF_PACKET IDS when no XDP program is
  # attached.
  capture_mode: xdp
  rule_paths:
    - "/etc/synapse/rules/*.rules"
  # Default: false. Alert only: do not ban the source of a matching flow.
  enforce_block: false
  # Default: a file under the working directory, filled by the platform's
  # managed rules. Empty turns off pulling managed rules: this set is local-only.
  managed_rules_path: ""

logging:
  # Default: info.
  level: info
  # Default: false (console only).
  file_logging_enabled: true
  # Default: /var/log/synapse
  log_directory: "/var/log/synapse"
  # Security-event log. Default file: {log_directory}/events.log; default
  # format: text.
  events_log_format: json
  # Suricata-compatible EVE JSON. Default: disabled; default file
  # {log_directory}/eve.json; default event_types: empty (every type).
  eve_log:
    enabled: true
    file: "/var/log/synapse/eve.json"
    event_types: [alert, stats]
