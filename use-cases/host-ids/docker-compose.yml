# Synapse as a host IDS. Needs `docker login registry.gen0sec.com` first; see
# https://docs.gen0sec.com/docs/client/installation
services:
  synapse:
    image: registry.gen0sec.com/gen0sec/synapse:0.8.8
    # Host network, so the agent sees the host's interfaces.
    network_mode: host
    cap_add:
      - NET_RAW    # AF_PACKET capture
      - NET_ADMIN
      - BPF
      - SYS_ADMIN
    # The agent locks memory for its packet and BPF buffers; the default memlock
    # limit is too low.
    ulimits:
      memlock:
        soft: -1
        hard: -1
    command: ["-c", "/etc/synapse/config.yaml"]
    volumes:
      - ./config.yaml:/etc/synapse/config.yaml:ro
      - ./rules:/etc/synapse/rules:ro
      - ./logs:/var/log/synapse
    restart: unless-stopped
