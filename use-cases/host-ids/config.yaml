# host-ids: Synapse as a host intrusion detection agent.
# Packets are read with AF_PACKET, matched against local Suricata-format
# rules, and alerts are written to an EVE JSON file. Nothing is blocked.
mode: agent

# Alert only. The agent does not attach XDP or manage a firewall.
firewall:
  mode: none

capture:
  enabled: true
  # AF_PACKET TPACKET_V3 ring. Use af_packet_recv on a kernel where the ring
  # does not work.
  mode: af_packet
  # The interface the IDS reads. Change it to your uplink (for example eth0);
  # `lo` lets you trigger the test rule from the same host.
  interface: lo

ids:
  enabled: true
  # The IDS reads packets with AF_PACKET instead of XDP.
  capture_mode: afpacketrecv
  rule_paths:
    - "/etc/synapse/rules/*.rules"
  # Alert only: do not ban the source of a matching flow.
  enforce_block: false
  # Turn off pulling managed rules: this example is local-only.
  managed_rules_path: ""

logging:
  level: info
  file_logging_enabled: true
  log_directory: "/var/log/synapse"
  eve_log:
    enabled: true
    file: "/var/log/synapse/eve.json"
    event_types: [alert, stats]
