# A passthrough host copies bytes without terminating TLS. From 0.8.9 it can
# pick its server by client address (maglev or ring_hash), so one client keeps
# landing on the same server. Needs Synapse 0.8.9 or later.
version: 2

hosts:
  pt.example.com:
    passthrough:
      # `tls:` is matched by SNI, `http:` by the Host header. Each wire takes its
      # own upstream list and lb block. This example serves only plain HTTP.
      http:
        upstreams:
          - { addr: 172.30.3.11:80, weight: 1 }
          - { addr: 172.30.3.12:80, weight: 1 }
          - { addr: 172.30.3.13:80, weight: 1 }
        lb:
          method: maglev        # or ring_hash. Key is client_ip, the only choice here
    listeners: [http]
