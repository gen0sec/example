events {}
http {
  # Port 443: TLS only.
  server {
    listen 443 ssl;
    ssl_certificate     /certs/backend.crt;
    ssl_certificate_key /certs/backend.key;
    location / { return 200 "tls ok, no client certificate\n"; }
  }
  # Port 8443: TLS and a client certificate signed by our CA.
  server {
    listen 8443 ssl;
    ssl_certificate     /certs/backend.crt;
    ssl_certificate_key /certs/backend.key;
    ssl_client_certificate /certs/ca.crt;
    ssl_verify_client on;
    location / { return 200 "mtls ok, client $ssl_client_s_dn\n"; }
  }
}
