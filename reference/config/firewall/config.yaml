# firewall: the kernel backend that enforces blocks (access rules, IDS bans).
mode: agent

firewall:
  # Backend. Default: auto (XDP, then nftables, then iptables, then none).
  #   xdp       eBPF/XDP, fastest, needs kernel support
  #   nftables  needs the nft command
  #   iptables  legacy, most compatible
  #   none      no kernel firewall; rules are enforced in user space only
  mode: auto

  # Capacity of the XDP IP-filter tries, per address family. When one fills,
  # new blocks are decided but never reach the kernel, and the agent logs
  # "access_rules: nothing is enforced". Raise it on hosts that ban heavily.
  # Pinned maps keep their old size until `synapse --force-stop` or a reboot.
  # Default: 50000 each.
  max_ip_filter_entries_v4: 50000
  max_ip_filter_entries_v6: 50000

  # Also attach XDP to veth* interfaces present at startup (east-west
  # traffic in a bridge-CNI cluster). Default: false.
  attach_veth: false
