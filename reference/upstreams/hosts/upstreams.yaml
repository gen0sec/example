# Hosts: which names are served, how TLS is handled, and the catch-all.
# Every file starts with `version: 2`. A host is exactly one of: terminating
# (tls.terminate), or passthrough (see ../passthrough/).
version: 2

# The host for every name no entry under `hosts:` matches (tried after exact
# names and wildcards). Without this block such a request is answered 404.
# It takes no `tls:` block: an unknown name is shown proxy.default_certificate
# from config.yaml. A bare "*" under `hosts:` is refused.
default_host:
  paths:
    "/":
      upstream: 10.0.0.10:8080
      health_check:
        type: none           # never probe; leaving the block out probes with the global settings

hosts:
  # Terminate TLS with a static certificate. `cert` is a certificate NAME, not a
  # path: the stem of <name>.crt / <name>.key (or the directory name for a
  # fullchain.pem / privkey.pem pair) in the proxy.certificates directory. A path
  # misses the lookup and Synapse serves the default certificate. The private key
  # is not named here (a `key` setting is not used); it sits beside the certificate.
  www.example.com:
    tls:
      terminate:
        cert: www.example.com
    upstream: 10.0.0.11:8080    # one backend for the whole host (a single "/" route)

  # Terminate TLS with a certificate from Let's Encrypt. The embedded ACME client
  # is deprecated and will be removed in a future release (--check-config warns
  # when proxy.acme is enabled); prefer a certificate you manage yourself, as
  # above. Needs proxy.acme in config.yaml. challenge_type is http-01 (default) or
  # dns-01. tls-alpn-01 is accepted but falls back to http-01. dns-01 is manual:
  # Synapse logs the TXT record to create and waits for you to publish it. `email`
  # overrides proxy.acme.email for this host.
  shop.example.com:
    tls:
      terminate:
        acme:
          challenge_type: dns-01
          email: admin@example.com
    upstream: 10.0.0.12:8080

  # `wildcard: true` requests the wildcard name *.<host> only; the bare host name
  # is NOT on that certificate. It needs dns-01.
  # wildcard-only.example.com:
  #   tls:
  #     terminate:
  #       acme: { challenge_type: dns-01, wildcard: true }

  # A wildcard name. Exact names win over wildcards. On a wildcard host, cert is
  # not used to pick the certificate: Synapse serves a loaded certificate whose
  # CN/SAN covers the requested name (here *.apps.example.com), else the default.
  "*.apps.example.com":
    tls:
      terminate:
        cert: apps.example.com
    upstream: 10.0.0.13:8080

  # Serve a host on named listeners only (names from proxy.listeners in
  # config.yaml). On any other listener it is treated like an unknown host: served
  # by default_host if one is set, otherwise answered 404.
  # Default: every listener that could serve it. --check-config does not check
  # that the names exist.
  admin.example.com:
    listeners: [https]
    tls:
      terminate:
        cert: admin.example.com
    upstream: 10.0.0.14:8080
