# Load balancing, health checks, timeouts and sticky sessions.
version: 2

proxy:
  # Consistent-hash by client IP across reconnects. Default: disabled.
  sticky_sessions:
    enabled: true

# Seconds (or 30s / 5m). Defaults: connect 30, read 120, write 30, idle 60.
# Host and route `timeouts` override these key by key.
timeouts:
  connect: 5
  read: 60

hosts:
  api.example.com:
    tls:
      terminate:
        cert: /etc/synapse/certs/api.example.com.crt
    paths:
      # lb.method: round_robin (default) | random | least_request |
      # weighted_round_robin | consistent. An entry is "host:port" or
      # { addr, weight } with weight defaulting to 1.
      "/v1":
        upstreams:
          - addr: 10.0.1.1:8080
          - addr: 10.0.1.2:8080
            weight: 3                # gets 3x the traffic of .1
        lb:
          method: weighted_round_robin
        timeouts:
          read: 300

      # Health check on a terminating route: `type` (http | tcp | none) and, for
      # http, `path`. Interval and thresholds are NOT accepted here (the probe
      # loop is shared): set proxy.upstream.healthcheck in config.yaml.
      # Default when omitted: probed with the global settings.
      "/v2":
        upstreams: [10.0.1.3:8080, 10.0.1.4:8080]
        lb: { method: least_request }
        health_check:
          type: http
          path: /healthz

      "/tcp":
        upstream: 10.0.1.5:8080
        health_check:
          type: tcp

      "/static":
        upstream: 10.0.1.6:8080
        health_check:
          type: none               # never probed
