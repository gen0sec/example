# Load balancing, health checks, timeouts and sticky sessions.
version: 2

proxy:
  # Cookie-based stickiness. Every response of a sticky route sets a signed
  # `backend_id` cookie, `<id>.<mac>` (10 minutes, HttpOnly, SameSite=Lax),
  # naming the backend that served it; a request that carries a valid cookie goes
  # to that backend. A cookie that is unsigned, signed with another key or names a
  # backend the route does not list is ignored and replaced. It does not hash by
  # client address. Default: disabled.
  # From Synapse 0.8.9 `secret_file` is required when `enabled` is true, and the
  # file is refused at load without it. It holds the signing key: at least 32
  # bytes, the whole file is the key. Make it once and give every node the same
  # file, or one node ignores the cookie another issued:
  #   (umask 077; head -c 32 /dev/urandom > sticky.key)
  # Mode 0600, owned by the user Synapse runs as (root for the packages). To
  # rotate, write sticky.key.new the same way and `mv` it over sticky.key.
  # See ../../../use-cases/sticky-sessions/.
  sticky_sessions:
    enabled: true
    secret_file: sticky.key

# Whole seconds only: a value such as "5s" is rejected. Defaults: connect 5,
# read 60, write 30, idle 60.
# Host and route `timeouts` override these key by key.
timeouts:
  connect: 5
  read: 60

hosts:
  api.example.com:
    tls:
      terminate:
        cert: api.example.com
    paths:
      # With no `lb:` block a terminating route balances by weighted round-robin.
      # From Synapse 0.8.9 `lb.method` also takes maglev, ring_hash and
      # least_request here, and `lb.persistence` pins a client address to a server:
      # see ../../../use-cases/lb-methods/ and ../../../use-cases/lb-source-ip-persistence/.
      # An entry is "host:port" or { addr, weight } with weight defaulting to 1.
      "/v1":
        upstreams:
          - addr: 10.0.1.1:8080
          - addr: 10.0.1.2:8080
            weight: 3                # gets 3x the traffic of .1
        timeouts:
          read: 300

      # Health check on a terminating route: `type` (http | tcp | none) and, for
      # http, `path`. Interval and thresholds are NOT accepted here (the probe
      # loop is shared): set proxy.upstream.healthcheck in config.yaml.
      # Default when omitted: probed with the global settings.
      "/v2":
        upstreams: [10.0.1.3:8080, 10.0.1.4:8080]
        health_check:
          type: http
          path: /healthz

      "/tcp":
        upstream: 10.0.1.5:8080
        health_check:
          type: tcp

      "/static":
        upstream: 10.0.1.6:8080
        health_check:
          type: none               # never probed
