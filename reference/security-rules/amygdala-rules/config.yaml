# Main config for this rules set. security_rules.yaml sits beside it and is
# loaded from the path in the agent's security-rules option (`make test` passes
# the file with --security-rules-config).
mode: proxy

proxy:
  listeners:
    - { name: http, address: "0.0.0.0:8080", mode: http }

# Amygdala is off by default and needs a build with the matching feature plus
# `enabled: true`. It needs firewall.mode auto or xdp. Fingerprint rules are
# only enforced while it runs.
firewall:
  mode: auto
  amygdala:
    enabled: false
    backend: auto
