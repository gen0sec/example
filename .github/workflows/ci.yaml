# Every job calls a make target, so CI runs what a human runs.
# `make test` (`synapse --check-config`) is not run here: the Synapse image
# needs a registry credential this repository does not have.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# A pull request from a fork cannot use this repository's Ubicloud runners,
# so it runs on a GitHub-hosted runner instead.
jobs:
  lint:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'ubicloud-standard-2' || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # yamllint is installed with pip, so pin the interpreter it runs on.
          python-version: '3.12'
      - run: make install
      - run: make lint

  splunk:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'ubicloud-standard-4' || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker --version
      # The test uses only the standard library, so the runner's python3 does.
      - run: make test-splunk
